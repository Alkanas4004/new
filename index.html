<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الشيف - تجربة طعام فاخرة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-utensils"></i>
                <span>مطعم الشيف</span>
            </div>
            <div class="nav-links">
                <a href="pages/home.html" class="nav-link" data-page="home">
                    <i class="fas fa-home"></i>
                    <span>الرئيسية</span>
                </a>
                <a href="pages/menu.html" class="nav-link" data-page="menu">
                    <i class="fas fa-book-open"></i>
                    <span>المنيو</span>
                </a>
                <a href="pages/cart.html" class="nav-link" data-page="cart">
                    <i class="fas fa-shopping-cart cart-icon"></i>
                    <span class="badge" id="cartCountBadge">0</span>
                    <span>السلة</span>
                </a>
                <a href="pages/favorites.html" class="nav-link" data-page="favorites">
                    <i class="fas fa-heart"></i>
                    <span class="badge" id="favCountBadge">0</span>
                    <span>المفضلة</span>
                </a>
                <a href="pages/orders.html" class="nav-link" data-page="orders">
                    <i class="fas fa-receipt"></i>
                    <span>طلباتي</span>
                </a>
                <a href="pages/game.html" class="nav-link" data-page="game">
                    <i class="fas fa-gamepad"></i>
                    <span>لعبة</span>
                </a>
            </div>
        </div>
    </nav>

    <main id="app">
        <!-- سيتم تحميل المحتوى هنا -->
        <div class="loading-container">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>
    </main>

    <!-- زر السكرول لأعلى -->
    <button id="scrollTopBtn" class="scroll-top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- شات بوت -->
    <div class="chat-bot">
        <div class="chat-toggle" onclick="window.toggleChat()">
            <i class="fas fa-comment-dots"></i>
        </div>
        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <i class="fas fa-robot"></i>
                <span>الشيف الافتراضي</span>
                <button onclick="window.toggleChat()">×</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">مرحباً! كيف يمكنني مساعدتك اليوم؟ 🍽️</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="اكتب رسالتك...">
                <button onclick="window.sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
                <button onclick="window.startVoice()">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
